
services:

  nginx:
    image: nginx:latest
    container_name: site_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./server/nginx_all_apps.conf:/etc/nginx/nginx.conf:ro
      - ./server/certbot/www/:/var/www/certbot/:ro
      - ./server/certbot/conf/live/m24tom.com/:/var/www/ssl/:ro
      - /home/admin/www/cgimages:/var/www/cgimages/:ro
      #note that symlinks will not work so need to make sure that 
      #after ssl certificate upgrade the actual .pem files are copied into this directory
    depends_on:
        - flask
    networks:
        - rag-network
    #add restart directive at your option for server installs
    #restart: unless-stopped

  flask:
    build:
      context: .
      dockerfile: flask.dockerfile
    container_name: site_flask
    #env_file:
    #  - ./.env_openai_key
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./fwww:/app/fwww
      - ./data/jobs:/app/jobs
      - ./data/www:/app/www
    depends_on:
      - chroma-rag
      - ollama-rag
    networks:
      - rag-network
    #add restart directive at your option for server installs
    #restart: unless-stopped

  chroma-rag:
    image: chromadb/chroma:1.1.1
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data/chroma:/data
    networks:
      - rag-network
    #add restart directive at your option for server installs
    #restart: unless-stopped

# docker run --gpus=all -d -v ollama:/root/.ollama -p 11434:11434 --name ollama ollama/ollama
  ollama-rag:
    build:
      context: .
      dockerfile: ollama.dockerfile
    #volumes:
    #  - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    networks:
      - rag-network
    #add restart directive at your option for server installs
    #restart: unless-stopped

networks:
  rag-network:
    driver: bridge


