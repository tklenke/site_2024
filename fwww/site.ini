# The site's settings. Keys, and settings of one machine only, go in site_local.ini.
[LEVEL]
DEBUG = True

[PATHS]
JOBS_DIR = /app/jobs
WWW_DIR = /app/www

[RAG]
USE_GPT = True
MAX_QUERY_LEN = 512
MAX_INPUT_LEN = 75
PROCESS_ID_LEN = 10
MAX_DISTANCE = .35
MIN_DOCUMENTS = 5
MAX_DOCUMENTS = 60
MAX_DRAFT_DOCUMENTS = 15

[HOSTS]
OLLAMA = http://ollama-rag:11434
CHROMA = chroma-rag

[MODELS]
EMBED = nomic-embed-text
LLM_DRAFT = gpt-6-luna
LLM_REVISE = gpt-6.2-sol

[PROMPTS]
PREFIX = search_query:

[OPTIONS]
SHOW_REVISE = True
